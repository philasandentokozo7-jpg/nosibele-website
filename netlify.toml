# Netlify configuration for the Nosibele website.
# Build: prerender SEO HTML into prod-build, then publish that folder.

[build]
  # strip-nb-app-pages runs inside prerender.js so stale design-system embeds cannot override app.compiled.js
  command = "cd build-tools && npm install && node prerender.js"
  publish = "prod-build"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
# Enforcing CSP after inventory of required origins (self, Formspree, Google
# Fonts/Analytics/Maps). HSTS without preload. frame-ancestors + XFO both set.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://formspree.io; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; frame-src https://www.google.com https://maps.google.com; connect-src 'self' https://formspree.io https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com https://*.analytics.google.com; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# HTML stamps CSS/JS with ?v=<content-hash>. Keep a modest TTL; never use
# "immutable" on unhashed filenames (that previously pinned stale UI for ~1 year).
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Canonical URL redirects
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

